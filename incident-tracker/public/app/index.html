<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gatekeeper">
<title>Gatekeeper</title>
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/app/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/app/icon.svg">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<header class="top" id="top" hidden>
  <div class="brand"><img src="/app/icon.svg" alt=""><span>Gatekeeper</span></div>
  <div class="who"><span class="queue-badge" id="queueBadge" hidden></span><span id="whoName"></span><span class="badge" id="whoRole"></span></div>
  <button class="link" id="logoutBtn" type="button">Log out</button>
</header>

<div class="alerts" id="alerts" aria-live="assertive"></div>
<main id="view" aria-live="polite"></main>
<div class="toast" id="toast" role="status" hidden></div>

<!-- First run: the person with the server's admin key creates the superadmin. -->
<template id="tpl-setup">
  <section class="card narrow">
    <h1>Set up Gatekeeper</h1>
    <p class="muted">First time only. You’ll be the <strong>superadmin</strong>: you add everyone else.</p>
    <form id="setupForm" autocomplete="off">
      <label>Admin key <span class="muted">(printed when the server was installed)</span>
        <input name="admin_key" type="password" required autocomplete="off"></label>
      <label>Your name <input name="name" required maxlength="40" autocomplete="name"></label>
      <label>Choose a PIN <span class="muted">(6–8 digits)</span>
        <input name="pin" type="password" inputmode="numeric" pattern="\d{6,8}" required autocomplete="new-password"></label>
      <label>PIN again <input name="pin2" type="password" inputmode="numeric" pattern="\d{6,8}" required autocomplete="new-password"></label>
      <p class="error" data-error hidden></p>
      <button class="primary big" type="submit">Create superadmin</button>
    </form>
  </section>
</template>

<template id="tpl-login">
  <section class="card narrow login">
    <img class="logo" src="/app/icon.svg" alt="">
    <h1>Gatekeeper</h1>
    <form id="loginForm" autocomplete="off">
      <label>Your name <input name="name" required maxlength="40" autocomplete="username" autocapitalize="words"></label>
      <div class="pin-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <input name="pin" type="hidden">
      <div class="keypad" role="group" aria-label="PIN">
        <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
        <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
        <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
        <button type="button" data-k="del" aria-label="Delete">⌫</button><button type="button" data-k="0">0</button>
        <button type="submit" class="go" aria-label="Log in">→</button>
      </div>
      <p class="error" data-error hidden></p>
    </form>
  </section>
</template>

<template id="tpl-home">
  <section class="home">
    <p class="hello" data-hello></p>
    <div class="tiles" data-tiles></div>
  </section>
</template>

<template id="tpl-users">
  <section class="card">
    <div class="row-between"><h1>People</h1><button class="link" data-back type="button">← Home</button></div>
    <ul class="people" data-list></ul>
    <h2 data-form-title>Add someone</h2>
    <form id="userForm" autocomplete="off">
      <input type="hidden" name="id">
      <label>Name <input name="name" required maxlength="40"></label>
      <label>Role
        <select name="role">
          <option value="area">Area supervisor</option>
          <option value="senior">Senior supervisor</option>
          <option value="superadmin">Superadmin</option>
        </select></label>
      <p class="hint muted" data-role-hint></p>
      <label data-hub-field>Area
        <select name="hub">
          <option value="East Hub">East</option><option value="West Hub">West</option>
          <option value="South Hub">South</option><option value="Hospitality Hub">Hospitality</option>
        </select></label>
      <label>PIN <span class="muted" data-pin-hint>(6–8 digits)</span>
        <input name="pin" type="password" inputmode="numeric" autocomplete="new-password"></label>
      <p class="error" data-error hidden></p>
      <div class="row-gap">
        <button class="primary" type="submit" data-submit>Add</button>
        <button class="ghost" type="button" data-cancel hidden>Cancel</button>
      </div>
    </form>
  </section>
</template>

<template id="tpl-log">
  <section class="log">
    <div class="row-between"><h1>Log someone</h1><button class="link" data-back type="button">← Home</button></div>

    <div class="block">
      <h2>What happened?</h2>
      <div class="seg three" data-decision>
        <button type="button" data-v="refused" class="d-refused">🔴<span>Refused</span></button>
        <button type="button" data-v="cool_off" class="d-away">🟠<span data-cool>30 min</span></button>
        <button type="button" data-v="ejected" class="d-ejected">⛔<span>Ejected</span></button>
      </div>
    </div>

    <div class="block">
      <div class="row-between"><h2>Seat</h2>
        <label class="scan-btn"><input type="file" accept="image/*" capture="environment" data-scan hidden>📷 Scan ticket</label></div>
      <div class="seat-grid">
        <label>Section<input data-section inputmode="text" autocapitalize="characters" autocomplete="off" maxlength="16" placeholder="313"></label>
        <label>Row<input data-row inputmode="text" autocapitalize="characters" autocomplete="off" maxlength="8" placeholder="YY"></label>
        <label>Seat<input data-seat inputmode="numeric" autocomplete="off" maxlength="80" placeholder="56"></label>
      </div>
      <p class="hint muted">Several seats in the row? <strong>205 206 207</strong> or <strong>205-207</strong></p>
      <div data-seat-alert></div>
    </div>

    <div class="block">
      <h2>Area</h2>
      <div class="chips" data-hubs></div>
    </div>

    <div class="block">
      <h2>Reasons <span class="muted">(one or more)</span></h2>
      <div class="chips" data-reasons></div>
      <label data-other hidden>What happened?<input data-other-text maxlength="300" placeholder="e.g. threw a bottle"></label>
      <label>Something else <span class="muted">(optional)</span><input data-extra-reason maxlength="60" placeholder="e.g. trespassing"></label>
    </div>

    <div class="block">
      <h2>Description <span class="muted">(optional)</span></h2>
      <div data-ai hidden>
        <label>Describe in a sentence<textarea data-ai-text rows="2" maxlength="600" placeholder="tall lad about 20, green hat, black jacket"></textarea></label>
        <button type="button" class="ghost small" data-ai-fill>✨ Fill in the buttons</button>
      </div>
      <div class="chips" data-gender></div>
      <div class="chips" data-height></div>
      <div class="chips" data-build></div>
      <div class="chips" data-age></div>
      <label>Wearing<input data-clothing maxlength="300" placeholder="green hat, black jacket"></label>
      <div class="party">People in the group
        <button type="button" class="ghost round" data-party-minus aria-label="Fewer">−</button>
        <strong data-party>1</strong>
        <button type="button" class="ghost round" data-party-plus aria-label="More">+</button>
      </div>
    </div>

    <div class="savebar">
      <p class="hint" data-missing></p>
      <button type="button" class="primary big" data-save disabled>Save</button>
    </div>
  </section>
</template>

<template id="tpl-result">
  <section class="result" data-result>
    <div class="result-card" data-card>
      <p class="big-status" data-status></p>
      <div data-lines></div>
    </div>
    <div class="row-gap">
      <button type="button" class="primary big" data-again>Log another</button>
      <button type="button" class="ghost big" data-home>Home</button>
    </div>
  </section>
</template>

<template id="tpl-check">
  <section>
    <div class="row-between"><h1>Check a seat</h1><button class="link" data-back type="button">← Home</button></div>
    <form data-form class="search-row">
      <input data-q autocapitalize="characters" autocomplete="off" maxlength="60" placeholder="313 YY 56 · 313 L · 313 · green hat" aria-label="Seat or words">
      <button class="primary" type="submit">Check</button>
    </form>
    <p class="muted hint">A whole section (<strong>313</strong>), a row (<strong>313 L</strong>), a seat, or words from a description.</p>
    <div data-results></div>
  </section>
</template>

<template id="tpl-feed">
  <section>
    <div class="row-between"><h1>Live feed <span class="live-dot" data-live title="Live"></span></h1><button class="link" data-back type="button">← Home</button></div>
    <div class="chips" data-filters></div>
    <ul class="records feed" data-items></ul>
    <p class="muted hint" data-empty hidden>Nothing logged yet.</p>
  </section>
</template>

<template id="tpl-edit">
  <section class="log">
    <div class="row-between"><h1 data-title>Change</h1><button class="link" data-back type="button">← Feed</button></div>
    <div class="block">
      <h2>Status</h2>
      <div class="chips" data-status></div>
    </div>
    <div class="block">
      <label>Reasons<input data-reasoning maxlength="2000"></label>
      <label>Description<input data-description maxlength="2000"></label>
      <div class="party">People in the group
        <button type="button" class="ghost round" data-party-minus aria-label="Fewer">−</button>
        <strong data-party>1</strong>
        <button type="button" class="ghost round" data-party-plus aria-label="More">+</button>
      </div>
    </div>
    <div class="row-gap">
      <button type="button" class="primary big" data-save>Save changes</button>
      <button type="button" class="danger big" data-delete hidden>Delete this record</button>
    </div>
  </section>
</template>

<script src="/app/app.js"></script>
</body>
</html>
